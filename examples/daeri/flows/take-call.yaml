# Take one call and finish it. On a bad network no call may show: that is not a failure, go on to the next round.
appId: dev.crewdroid.daeri
---
- extendedWaitUntil:
    visible: "수락|운행 완료"
    timeout: 12000
    optional: true
- runFlow:
    when:
      visible: "수락"
    commands:
      - tapOn:
          text: "수락"
          index: 0
          optional: true
      - extendedWaitUntil:
          visible: "운행 완료|이미 배차된 콜입니다"
          timeout: 15000
          optional: true
- runFlow:
    when:
      visible: "운행 완료"
    commands:
      - tapOn:
          text: "운행 완료"
          optional: true
      - extendedWaitUntil:
          visible: "수락"
          timeout: 15000
          optional: true
- pressKey: Home
