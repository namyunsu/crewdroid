<!doctype html>
<!-- crewdroid 15 s hero (T50). render.mjs injects window.HERO (storyboard, clip frame URLs, hero-clips.json commands, measured
     numbers) and calls seek(t) for every frame; nothing animates on its own, so a frame depends only on t. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hero.css">
</head>
<body>
<section class="scene" id="title"><div class="bg" id="titlebg"></div><h1 id="words"></h1></section>

<section class="scene" id="up">
  <div class="term"><p id="upcmd" class="on"></p><p id="upout" class="out"></p></div>
  <div class="row" style="top:166px"><span class="lbl">first device ready</span></div>
  <div class="row" style="top:202px"><span class="big" id="counter">0.0</span><span class="big"> s</span></div>
  <div class="row" style="top:272px"><div class="bar us" id="barus"></div></div>
  <div class="row" style="top:306px"><span class="stock-v">stock emulator <span id="stockv">0.0</span> s</span></div>
  <div class="row" style="top:346px"><div class="bar stock" id="barstock"></div></div>
  <div class="row" style="top:380px"><span class="lbl">cold boot, same PC</span></div>
  <div id="updevs"></div>
</section>

<section class="scene" id="agent">
  <p class="cap" id="agentcap"></p>
  <div class="term" id="agentterm"></div>
  <div class="panel">
    <h3>What your agent reads</h3>
    <div class="cols">
      <div class="col tree"><div class="stat">crewdroid tree</div><pre id="tree"></pre>
        <div class="stat"><b id="atok"></b> tokens</div><div class="stat"><b id="asec"></b> s per task</div><div class="stat" id="arob"></div></div>
      <div class="col shot"><div class="stat">screenshot</div><div class="thumb"><img id="thumb"></div>
        <div class="stat"><b id="btok"></b> tokens</div><div class="stat"><b id="bsec"></b> s per task</div><div class="stat" id="brob"></div></div>
    </div>
  </div>
  <div class="dev" id="agentdev"><img id="agentimg"><i class="dot" id="dot"></i><b class="speed" id="agentspeed"></b></div>
</section>

<section class="scene" id="offline">
  <p class="cap" id="offcap"></p>
  <div class="term" id="offterm"></div>
  <p class="who" id="who"></p>
  <div class="dev" id="offdev"><img id="offimg"><b class="speed" id="offspeed"></b></div>
</section>

<section class="scene" id="screens">
  <p class="cap" id="scrcap"></p>
  <div class="dev" id="scrdev"><img id="scrimg"><b class="speed" id="scrspeed"></b></div>
  <p class="dname" id="scrname"></p>
</section>

<section class="scene" id="end">
  <p class="logo">crewdroid</p>
  <p class="tag" id="tag"></p>
  <p class="pill mono" id="pill"></p>
  <p class="stats" id="stats"></p>
</section>
<script>
const H = window.HERO, SB = H.storyboard, N = H.numbers;
const S = Object.fromEntries(SB.scenes.map((s) => [s.id, s]));
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const frame = (clip, sec) => { const f = H.frames[clip]; return f[clamp(Math.floor(sec * H.clipFps), 0, f.length - 1)]; };
// scene time -> clip time along the storyboard's keyframes; also the playback rate of the current segment (shown when sped up)
const along = (map, u) => {
  for (let i = 1; i < map.length; i++) if (u <= map[i][0] || i === map.length - 1) {
    const [a, b] = [map[i - 1], map[i]], r = (b[1] - a[1]) / (b[0] - a[0]);
    return { t: clamp(a[1] + (u - a[0]) * r, Math.min(a[1], b[1]), Math.max(a[1], b[1])), rate: r };
  }
};
const speed = (el, rate) => { el.textContent = `${rate.toFixed(1).replace(/\.0$/, "")}×`; el.style.opacity = rate >= 1.3 ? 1 : 0; };
const short = (p) => p.replace(/^([a-z]+)(\d+).*/, (_, a, n) => a[0].toUpperCase() + a.slice(1) + n);
const typed = (text, t0, t, cps = 26) => text.slice(0, clamp(Math.round((t - t0) * cps), 0, text.length));
const fmt = (n) => n.toLocaleString("en-US");
const termLines = (el, cmds) => { el.innerHTML = cmds.map(() => "<p></p>").join(""); [...el.children].forEach((p, i) => (p.textContent = cmds[i])); return [...el.children]; };
// a command line: issued at atSeconds (dim), green while its effect is on screen, white once the next effect happened
const light = (rows, cmds, ct) => cmds.forEach((c, i) => {
  const next = cmds[i + 1]?.effectSeconds ?? Infinity;
  rows[i].className = ct < c.atSeconds ? "" : ct < c.effectSeconds ? "on" : ct < next ? "on now" : "on done";
});

// 1 title
$("titlebg").style.backgroundImage = `url(${H.frames.boot.at(-1)})`;
const words = S.title.text.split(" ");
$("words").innerHTML = words.map((w) => `<span>${w}</span>`).join("");
const wordEls = [...$("words").children];

// 2 up: three device frames cut out of boot.mp4 (x / width from hero-clips.json)
const boot = H.clips.boot, bs = 238 / boot.height, gap = 14;
let bx = 490 + (450 - (boot.devices.reduce((a, d) => a + d.width, 0) * bs + gap * (boot.devices.length - 1))) / 2;
$("updevs").innerHTML = boot.devices.map((d) => {
  const w = d.width * bs, html = `<div class="dev up" style="left:${bx}px;top:120px;width:${w}px;height:238px"><img src="" style="left:${-d.x * bs}px;width:${boot.width * bs}px"></div>
    <p class="dname" style="left:${bx - 20}px;width:${w + 40}px;top:368px">${short(d.profile)}<br>API ${d.api}</p>`;
  bx += w + gap; return html;
}).join("");
const bootImgs = [...document.querySelectorAll(".dev.up img")];

// 3 agent
$("agentcap").textContent = S.agent.caption;
const agentCmds = H.clips.agent.commands, agentRows = termLines($("agentterm"), agentCmds.map((c) => c.cmd));
const ah = 452, aw = ah * H.clips.agent.width / H.clips.agent.height;
Object.assign($("agentdev").style, { left: `${948 - aw}px`, top: "60px", width: `${aw}px`, height: `${ah}px` });
$("agentimg").style.left = "0px"; $("agentimg").style.width = "100%";
$("tree").textContent = SB.tree.join("\n");
$("thumb").src = H.thumb;
$("atok").textContent = fmt(N.A.tokens); $("asec").textContent = N.A.seconds.toFixed(1);
$("btok").textContent = fmt(N.B.tokens); $("bsec").textContent = N.B.seconds.toFixed(1);
$("arob").innerHTML = `fold/flip <span class="${N.A.robust ? "ok" : "bad"}">${N.A.robust ? "✓" : "✗"}</span>`;
$("brob").innerHTML = `fold/flip <span class="${N.B.robust ? "ok" : "bad"}">${N.B.robust ? "✓" : "✗"}</span>`;
const taps = agentCmds.map((c) => ({ c, at: SB.taps[c.cmd.match(/--text (.+)$/)?.[1]] })).filter((x) => x.at);

// 4 offline
$("offcap").textContent = S.offline.caption;
const offCmds = H.clips.offline.commands.filter((c) => / net /.test(c.cmd));
const offRows = termLines($("offterm"), [...offCmds.map((c) => c.cmd), "✓ synced"]);
offRows.at(-1).classList.add("out");
const oh = 440, ow = oh * H.clips.offline.width / H.clips.offline.height;
Object.assign($("offdev").style, { left: `${944 - ow}px`, top: "72px", width: `${ow}px`, height: `${oh}px` });
$("offimg").style.left = "0px"; $("offimg").style.width = "100%";
$("who").textContent = `left phone = ${H.clips.offline.devices[0].serial}`;

// 5 screens
$("scrcap").textContent = S.screens.caption;

// 6 end
$("tag").textContent = S.end.tagline; $("pill").textContent = S.end.pill;
$("stats").innerHTML = `1 device ready in <b>${N.ready} s</b> · <b>${fmt(N.ramMB)} MB</b> RAM<br><b>${N.tokenRatio}× fewer tokens</b> than screenshots · same time`;

window.seek = (t) => {
  for (const s of SB.scenes) {
    const first = s === SB.scenes[0], last = s === SB.scenes.at(-1);
    const inn = first ? 1 : ease((t - s.start + 0.15) / 0.3), out = last ? 1 : ease((s.end + 0.15 - t) / 0.3), e = Math.min(inn, out);
    const el = $(s.id);
    el.style.opacity = t < s.start - 0.15 || t > s.end + 0.15 ? 0 : e;
    el.style.transform = `translateX(${(1 - inn) * 60 - (1 - out) * 60}px) scale(${0.97 + 0.03 * e})`;
  }
  // 1: words punch in one by one
  wordEls.forEach((w, i) => { const e = clamp((t - 0.15 - i * 0.3) / 0.18, 0, 1); w.style.opacity = e; w.style.transform = `scale(${1.8 - 0.8 * ease(e)})`; });
  // 2: type `up`, play boot.mp4, tick both counters on one shared clock (22.3 s of real time over 2.4 s of video)
  const u = t - S.up.start;
  $("upcmd").textContent = typed(S.up.cmd, 0.1, u);
  $("upout").textContent = u > 1.2 ? `✓ ${boot.devices.length} devices` : ""; $("upout").className = u > 1.2 ? "out on now" : "out";
  const bt = along(S.up.map, clamp(u, 0, 3)).t;
  for (const img of bootImgs) img.src = frame("boot", bt);
  const clock = clamp((u - 0.4) / 2.4, 0, 1) * N.stock;
  $("counter").textContent = Math.min(clock, N.ready).toFixed(1);
  $("stockv").textContent = Math.min(clock, N.stock).toFixed(1);
  $("barus").style.width = `${(Math.min(clock, N.ready) / N.stock) * 456}px`;
  $("barstock").style.width = `${(Math.min(clock, N.stock) / N.stock) * 456}px`;
  // 3: agent.mp4 with the commands lit in sync, touch dots where the taps land, thumbnail shrinking
  const a = along(S.agent.map, clamp(t - S.agent.start, 0, S.agent.end - S.agent.start));
  $("agentimg").src = frame("agent", a.t); speed($("agentspeed"), a.rate);
  light(agentRows, agentCmds, a.t);
  const tap = taps.find((x) => a.t >= x.c.effectSeconds - 0.6 && a.t <= x.c.effectSeconds + 0.1);
  $("dot").style.opacity = tap ? 1 : 0;
  if (tap) Object.assign($("dot").style, { left: `${tap.at[0] * 100}%`, top: `${tap.at[1] * 100}%` });
  $("thumb").style.height = `${136 - 64 * ease((t - S.agent.start - 0.5) / 3)}px`;
  // 4: offline.mp4, net commands in sync, "synced" once the online effect is on screen
  const o = along(S.offline.map, clamp(t - S.offline.start, 0, S.offline.end - S.offline.start));
  $("offimg").src = frame("offline", o.t); speed($("offspeed"), o.rate);
  light(offRows, offCmds, o.t);
  offRows.at(-1).className = o.t >= offCmds.at(-1).effectSeconds ? "out on now" : "out";
  // 5: hard cuts between fold.mp4 and dark.mp4
  const v = clamp(t - S.screens.start, 0, S.screens.end - S.screens.start);
  const cut = S.screens.cuts.findLast((c) => v >= c.at), clip = H.clips[cut.clip], d = clip.devices[0];
  const ch = 420, cw = ch * clip.width / clip.height;
  Object.assign($("scrdev").style, { left: `${(960 - cw) / 2}px`, top: "64px", width: `${cw}px`, height: `${ch}px` });
  $("scrimg").style.left = "0px"; $("scrimg").style.width = "100%";
  $("scrimg").src = frame(cut.clip, cut.from + (v - cut.at) * cut.rate); speed($("scrspeed"), cut.rate);
  $("scrname").textContent = `${short(d.profile)} · API ${d.api} · ${cut.label}`;
};
seek(0);
</script>
</body>
</html>
