# T68 (FR-46): tag push only. npm trusted publishing (OIDC): no token secret anywhere.
# One-time setup on npmjs.com: package crewdroid -> Settings -> Trusted publishing -> GitHub, namyunsu/crewdroid, release.yml.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    if: github.repository == 'namyunsu/crewdroid'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: 1.3.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Publish to npm (prepack builds the helper APK with the runner SDK)
        run: npm publish --provenance --access public
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
