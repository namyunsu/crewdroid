# T58 (FR-37): runs only in the public repo, only on main pushes and pull requests. Checked statically by scripts/check-ci.mjs.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

jobs:
  test:
    if: github.repository == 'namyunsu/crewdroid'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-versions.mjs
      - run: npm test

  skills:
    if: github.repository == 'namyunsu/crewdroid'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Skill files have valid front matter (name, description)
        run: node scripts/check-agent-files.mjs

  # GitHub's Apple Silicon runners have no HVF, so up is only tried: setup and the AVD are the real check on a Mac here.
  mac-setup:
    if: github.repository == 'namyunsu/crewdroid'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node bin/crewdroid.mjs setup --yes --images 34 --json
      - run: node --import tsx -e "import('./src/avd.ts').then(async (m) => console.log(await m.createAvd('android-34/google_atd')))"
      - name: up (needs HVF, informative)
        continue-on-error: true
        timeout-minutes: 12
        run: node bin/crewdroid.mjs up --api 34 --json

  emulator-smoke:
    if: github.repository == 'namyunsu/crewdroid'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CRESDK: ${{ github.workspace }}/.crewdroid-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm ci
      - name: Build every bundled APK as npm publish does (prepack; 0.2.5's release failed here first)
        run: npm pack --dry-run > /dev/null
      - uses: actions/cache@v4
        with:
          path: ${{ env.CRESDK }}
          key: crewdroid-sdk-${{ runner.os }}-${{ hashFiles('src/setup.ts') }}
      - name: Smoke (setup, up, shot, screen, install, launch, logs, down)
        env:
          ANDROID_SDK_ROOT: ${{ env.CRESDK }}
          ANDROID_HOME: ${{ env.CRESDK }}
          CI_SMOKE_PNG: ${{ github.workspace }}/smoke.png
        run: node --import tsx scripts/ci-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore
